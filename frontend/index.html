<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess AI Engine</title>

    <!-- CSS Dependencies -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header / Controls -->
      <header class="header">
        <div class="logo">
          <i class="fa-solid fa-chess-knight"></i> Chess AI
        </div>
        <div class="controls">
          <button id="btn-new-game" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> New Game
          </button>
          <button id="btn-flip" class="btn btn-secondary">
            <i class="fa-solid fa-retweet"></i> Flip Board
          </button>
          <button
            id="btn-analysis"
            class="btn btn-secondary"
            data-active="false"
          >
            <i class="fa-solid fa-microscope"></i> Analysis: Off
          </button>
          <select id="side-select" class="dropdown">
            <option value="white">Play as White</option>
            <option value="black">Play as Black</option>
          </select>
          <select id="theme-select" class="dropdown">
            <option value="classic">Classic Theme</option>
            <option value="blue">Blue Theme</option>
            <option value="dark">Dark Theme</option>
            <option value="wood">Wood Theme</option>
          </select>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Left Panel: Info -->
        <aside class="panel left-panel">
          <div class="panel-section captures-section">
            <h3>Captured</h3>
            <div class="captures-container">
              <div id="captures-white" class="captures-row"></div>
              <div id="captures-black" class="captures-row"></div>
            </div>
          </div>

          <div class="panel-section history-section">
            <h3>Move History</h3>
            <div id="move-history" class="move-list">
              <!-- Moves will be injected here -->
            </div>
          </div>
        </aside>

        <!-- Center: Board -->
        <div class="board-area">
          <div id="board" style="width: 100%"></div>
          <div class="status-bar">
            <span id="status-text">Welcome! Start a new game.</span>
          </div>
        </div>

        <!-- Right Panel: Eval -->
        <aside class="panel right-panel">
          <div class="eval-bar-container">
            <div id="eval-bar-fill" class="eval-bar-fill"></div>
            <span id="eval-score" class="eval-score">0.0</span>
          </div>
        </aside>
      </main>

      <!-- Footer for Mobile Controls if needed, or just credits -->
      <footer class="footer">
        <p>Engine Status: <span id="engine-status">Idle</span></p>
      </footer>
    </div>

    <!-- JS Dependencies -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
